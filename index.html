<style>
:root{--bg:#FFD9A0;--card:#FFF3E6;--ink:#5B2E2E;--soft:#9A6A5A;--org:#F59A4C;--pink:#F7A8A8;--line:#E7B889;--ok:#7DBE6E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3B2A24;--card:#4D372E;--ink:#FFE8D2;--soft:#D9B79F;--line:#6E5044}}
:root[data-theme="dark"]{--bg:#3B2A24;--card:#4D372E;--ink:#FFE8D2;--soft:#D9B79F;--line:#6E5044}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px 16px 40px}
h2{font-size:20px;font-weight:600;margin:24px 0 10px}
.hero{display:flex;align-items:center;gap:8px}
.mascot{width:42%;flex:none;animation:bob 3s ease-in-out infinite}
.mascot.pop{animation:pop .5s}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pop{30%{transform:scale(1.12) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none!important}}
.bal{flex:1;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:12px 14px;position:relative}
.bal b{font-size:44px;font-weight:600;line-height:1}
.bal span{color:var(--soft);font-size:15px}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;background:var(--bg);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--org);transition:width .4s;border-radius:99px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,input{font:inherit;color:var(--ink)}
button{border:3px solid var(--ink);background:var(--pink);border-radius:99px;padding:8px 14px;font-weight:500;cursor:pointer;min-height:44px}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--org);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
input{flex:1;min-width:0;border:3px solid var(--ink);background:var(--bg);border-radius:99px;padding:8px 14px;min-height:44px}
.go{background:var(--org)}
.note{color:var(--soft);font-size:14px;margin:8px 0 0}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px;text-align:center}
.item .e{font-size:38px;line-height:1.2}
.item p{margin:2px 0 8px;font-weight:500}
.item small{display:block;color:var(--soft);margin-bottom:8px}
.item button{width:100%;background:var(--org)}
.bag{display:flex;gap:8px;flex-wrap:wrap}
.bag span{background:var(--card);border:3px solid var(--ink);border-radius:99px;padding:6px 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;font-weight:500;z-index:30}
.ov{position:fixed;inset:0;background:rgba(40,20,15,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 16px;z-index:20;overflow:auto}
.ov.on{display:flex}
.dlg{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;max-width:340px;width:100%;margin:auto}
.dlg h3{margin:0 0 6px;font-size:22px}
.tk{position:relative;background:#EFE6D2;color:#1E1A17;padding:16px 16px 22px;margin-bottom:18px;border-top:2px dotted #CFC4AA}
.tk::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 0,#EFE6D2 6px,transparent 6.5px) 0 0/12px 12px repeat-x}
.tk .lg{display:block;width:48px;margin:0 auto}
.tk h3{font-size:32px;letter-spacing:.5px;font-weight:600;text-align:center;margin:6px 0 4px}
.tk .sub{text-align:center;font-size:12px;letter-spacing:.14em;font-weight:500;text-transform:uppercase}
.tk .st{text-align:center;font-size:28px;margin:10px 0 4px;letter-spacing:2px;min-height:34px}
.tk table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tk th{font-size:12px;letter-spacing:.12em;text-align:left;font-weight:500;padding-bottom:4px}
.tk td{padding:7px 0;border-bottom:1px dashed #BFB49C}
.tk .r{text-align:right}
.tk .tot{border-top:2px solid #1E1A17;margin-top:12px;padding-top:8px}
.tk .tot div{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.08em;font-weight:500;padding:2px 0}
.tk .tot .big{font-weight:600;font-size:17px}
.tk .ft{text-align:center;font-weight:600;font-size:18px;margin-top:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>

<path d="M92 46 L100 66 L108 46 Z M70 52 L82 66 L84 50 Z M130 52 L118 66 L116 50 Z" fill="#5B2E2E"/>
<ellipse cx="100" cy="116" rx="60" ry="46" fill="#FFF3E6"/>
<path d="M26 98 L48 104 L26 112 Z M28 124 L48 124 L30 134 Z M174 98 L152 104 L174 112 Z M172 124 L152 124 L170 134 Z" fill="#5B2E2E"/>
<ellipse cx="56" cy="120" rx="14" ry="9" fill="#F7A8A8" opacity=".7"/><ellipse cx="144" cy="120" rx="14" ry="9" fill="#F7A8A8" opacity=".7"/>
<path d="M60 102 Q72 88 84 102 M116 102 Q128 88 140 102" fill="none" stroke="#5B2E2E" stroke-width="5" stroke-linecap="round"/>

<div class="bal"><span>today's jar</span><br><b id="bal">300</b> <span>/ 300 tygers</span>
<div class="bar"><i id="fill" style="width:100%"></i></div></div>
</div>

<h2>Walk the pets</h2>
<div class="panel">
<div>Steps today: <b id="steps">0</b></div>
<div class="bar"><i id="stepfill" style="width:0%"></i></div>
<p class="note" id="next">100 steps = 3 tygers</p>
<div class="row"><input id="custom" type="number" min="1" inputmode="numeric" placeholder="Enter steps"><button class="go" id="add">Add steps</button><button data-a="editsteps">Edit steps</button></div>
</div>

<h2>Active movements</h2>
<div class="panel">
<div>Minutes today: <b id="mins">0</b></div>
<div class="bar"><i id="minfill" style="width:0%"></i></div>
<p class="note" id="nextm">10 minutes = 6 tygers</p>
<div class="row"><input id="custommin" type="number" min="1" inputmode="numeric" placeholder="Enter minutes"><button class="go" id="addmin">Add minutes</button><button data-a="editmins">Edit minutes</button></div>
</div>

<h2>Tyger shop</h2>
<div class="shop" id="shop"></div>
<div class="panel" style="margin-top:12px"><b>Your own item</b>
<div class="row"><input id="cname" type="text" maxlength="30" placeholder="Item name" aria-label="Item name"><input id="cprice" type="number" min="1" inputmode="numeric" placeholder="Tygers" aria-label="Price in tygers" style="flex:0 0 100px"></div>
<div class="row"><button class="go" id="buycustom">Buy item</button></div></div>

<h2>Your bag</h2>
<div class="bag" id="bag"></div>
<div class="row"><button class="go" data-a="export">Export ticket</button><button data-a="reset">Reset day</button></div>
<p class="note">The jar refills to 300 every new day. Steps and active minutes can push it past 300.</p>
<div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
var KEY="tygerTown1",CAP=300;
var ITEMS=[{id:"flower",n:"Flower",e:"🌸",p:10},{id:"salad",n:"Salad",e:"🥗",p:30},{id:"cookie",n:"Cookie",e:"🍪",p:40},{id:"yoyo",n:"Yo-yo",e:"🪀",p:100},{id:"bow",n:"Bow",e:"🎀",p:150},{id:"teddy",n:"Teddy bear",e:"🧸",p:200}];
function today(){return new Date().toLocaleDateString("en-CA")}
var S={day:today(),bal:CAP,steps:0,mins:0,inv:{},cust:{},log:[],earned:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==="object")S=o}}catch(e){}
if(S.day!==today()){S.day=today();S.bal=CAP;S.steps=0;S.mins=0;S.log=[];S.earned=0}
S.inv=S.inv||{};S.log=S.log||[];S.earned=S.earned||0;S.mins=S.mins||0;S.cust=S.cust||{};
var known=ITEMS.map(function(i){return i.id});S.log=S.log.filter(function(l){return known.indexOf(l.id)>-1||S.cust[l.id]});Object.keys(S.inv).forEach(function(k){if(known.indexOf(k)<0&&!S.cust[k])delete S.inv[k]});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1800)}
function pop(){var m=$("m");m.classList.remove("pop");void m.getBoundingClientRect();m.classList.add("pop")}
function addSteps(n){n=Math.floor(n);if(!(n>0)){toast("Enter a number of steps");return}
var prev=S.steps;S.steps+=n;var g=(Math.floor(S.steps/100)-Math.floor(prev/100))*3;
if(g>0){S.bal+=g;S.earned+=g;toast("+"+g+" tygers!");pop()}
else toast("+"+n+" steps");save();render()}
function buy(id){var it=ITEMS.filter(function(x){return x.id===id})[0];if(!it||S.bal<it.p)return;S.bal-=it.p;S.inv[id]=(S.inv[id]||0)+1;S.log.push({id:id,p:it.p});toast("Bought "+it.n+"!");pop();save();render()}
function render(){
$("bal").textContent=S.bal;$("fill").style.width=Math.min(100,S.bal/CAP*100)+"%";
$("steps").textContent=S.steps.toLocaleString();
$("mins").textContent=S.mins;var rm=S.mins%10;$("minfill").style.width=(rm*10)+"%";$("nextm").textContent=(10-rm)+" more minutes for the next 6 tygers";
var r=S.steps%100;$("stepfill").style.width=r+"%";$("next").textContent=(100-r)+" more steps for the next 3 tygers";
$("shop").innerHTML=ITEMS.map(function(i){return '<div class="item"><div class="e">'+i.e+'</div><p>'+i.n+'</p><small>'+i.p+' tygers</small><button data-b="'+i.id+'"'+(S.bal<i.p?" disabled":"")+'>Buy</button></div>'}).join("");
var bi=ITEMS.filter(function(i){return S.inv[i.id]}).map(function(i){return{e:i.e,n:i.n,q:S.inv[i.id]}}).concat(Object.keys(S.cust).filter(function(k){return S.inv[k]}).map(function(k){return{e:"✨",n:S.cust[k].n+" ("+S.cust[k].p+")",q:S.inv[k]}}));
var h=bi.map(function(b){return "<span>"+b.e+" "+esc(b.n)+" ×"+b.q+"</span>"}).join("");
$("bag").innerHTML=h||'<p class="note">Nothing yet. Buy something from the shop.</p>'}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
if(t.dataset.s)addSteps(+t.dataset.s);else if(t.dataset.b)buy(t.dataset.b);
else if(t.id==="add"){addSteps(+$("custom").value);$("custom").value=""}
else if(t.id==="buycustom")buyCustom();
else if(t.id==="addmin"){addMins(+$("custommin").value);$("custommin").value=""}
else if(t.dataset.a)act(t.dataset.a)});
function addMins(n){n=Math.floor(n);if(!(n>0)){toast("Enter a number of minutes");return}
var prev=S.mins;S.mins+=n;var g=(Math.floor(S.mins/10)-Math.floor(prev/10))*6;
if(g>0){S.bal+=g;S.earned+=g;toast("+"+g+" tygers!");pop()}else toast("+"+n+" minutes");save();render()}
function fmt(){return new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function spent(){return S.log.reduce(function(a,l){return a+l.p},0)}
function info(l){var f=ITEMS.filter(function(i){return i.id===l.id})[0];return f||{id:l.id,n:(S.cust[l.id]||{}).n||"Item",e:"✨",p:l.p}}
function agg(){var m={},o=[];S.log.forEach(function(l){if(!m[l.id]){m[l.id]={i:info(l),q:0};o.push(m[l.id])}m[l.id].q++});return o}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function buyCustom(){var n=$("cname").value.trim().slice(0,30),p=Math.floor(+$("cprice").value);
if(!n){toast("Type an item name");return}if(!(p>0)){toast("Enter a price in tygers");return}
if(S.bal<p){toast("Not enough tygers");return}
var id="x_"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"_"+p;S.cust[id]={n:n,p:p};S.bal-=p;S.inv[id]=(S.inv[id]||0)+1;S.log.push({id:id,p:p});
$("cname").value="";$("cprice").value="";toast("Bought "+n+"!");pop();save();render()}
function ticketHTML(){var a=agg();
var rows=a.length?a.map(function(x){return '<tr><td>'+x.q+'</td><td>'+esc(x.i.n)+'</td><td class="r">'+x.i.p*x.q+'</td></tr>'}).join(""):'<tr><td colspan="3">No purchases yet</td></tr>';
return '<div class="tk"><svg class="lg" viewBox="0 0 60 56" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="#F59A4C"/><circle cx="46" cy="14" r="10" fill="#F59A4C"/><circle cx="30" cy="32" r="22" fill="#F59A4C"/><ellipse cx="22" cy="30" rx="3" ry="4" fill="#1E1A17"/><ellipse cx="38" cy="30" rx="3" ry="4" fill="#1E1A17"/></svg><h3>TYGER TICKET</h3><div class="sub">Your day &middot; '+fmt()+'</div><div class="st">'+a.map(function(x){return x.i.e}).join("")+'</div><table><tr><th>QTY</th><th>ITEM</th><th class="r">TYGERS</th></tr>'+rows+'</table><div class="tot"><div class="big"><span>SPENT</span><span>'+spent()+' TYGERS</span></div><div><span>STEPS</span><span>'+S.steps.toLocaleString()+'</span></div><div><span>MINUTES ACTIVE</span><span>'+S.mins+'</span></div><div><span>EARNED</span><span>+'+S.earned+' TYGERS</span></div><div><span>LEFT</span><span>'+S.bal+' / 300</span></div></div><div class="ft">tyger town</div></div>'}
function ticketText(){var L=["TYGER TICKET","Your day: "+fmt(),""],a=agg();
if(a.length)a.forEach(function(x){L.push(x.q+" x "+x.i.n+" - "+x.i.p*x.q+" tygers")});else L.push("No purchases yet");
L.push("","SPENT: "+spent()+" tygers","STEPS: "+S.steps,"MINUTES ACTIVE: "+S.mins,"EARNED: +"+S.earned+" tygers","LEFT: "+S.bal+" / 300","","tyger town");return L.join("\n")}
function openDlg(h){$("dlg").innerHTML=h;$("ov").classList.add("on");var b=$("dlg").querySelector("button");if(b)b.focus()}
function closeDlg(){$("ov").classList.remove("on")}
function act(a){
if(a==="reset")openDlg('<h3>Reset day?</h3><p class="note" style="margin:0 0 14px">Your jar refills to 300 tygers, and today&#39;s steps and ticket are cleared. Your bag is emptied too.</p><div class="row"><button data-a="close">Keep my day</button><button class="go" data-a="doreset">Reset day</button></div>');
else if(a==="doreset"){S.bal=CAP;S.steps=0;S.mins=0;S.log=[];S.earned=0;S.inv={};S.cust={};save();render();closeDlg();toast("New day, 300 tygers!");pop()}
else if(a==="export")openDlg(ticketHTML()+'<div class="row"><button data-a="close">Close</button><button class="go" data-a="copy">Copy text</button>'+(navigator.share?'<button class="go" data-a="share">Share</button>':"")+'</div><p class="note">Tip: screenshot the ticket to save it as a picture.</p>');
else if(a==="editsteps"){openDlg('<h3>Edit steps</h3><p class="note" style="margin:0 0 10px">Set today&#39;s total. Tygers from steps are adjusted to match.</p><input id="fixv" type="number" min="0" inputmode="numeric" value="'+S.steps+'" aria-label="Steps today"><div class="row"><button data-a="close">Cancel</button><button class="go" data-a="savesteps">Save steps</button></div>');$("fixv").focus();$("fixv").select()}
else if(a==="savesteps"){var raw=$("fixv").value,v=Math.floor(+raw);
if(raw===""||!(v>=0)){toast("Enter a number of steps");return}
var d=(Math.floor(v/100)-Math.floor(S.steps/100))*3;S.steps=v;S.bal=Math.max(0,S.bal+d);S.earned=Math.max(0,S.earned+d);save();render();closeDlg();toast("Steps set to "+v.toLocaleString()+(d?" ("+(d>0?"+":"")+d+" tygers)":""))}
else if(a==="editmins"){openDlg('<h3>Edit minutes</h3><p class="note" style="margin:0 0 10px">Set today&#39;s total. Tygers from minutes are adjusted to match.</p><input id="fixm" type="number" min="0" inputmode="numeric" value="'+S.mins+'" aria-label="Active minutes today"><div class="row"><button data-a="close">Cancel</button><button class="go" data-a="savemins">Save minutes</button></div>');$("fixm").focus();$("fixm").select()}
else if(a==="savemins"){var rw=$("fixm").value,m=Math.floor(+rw);
if(rw===""||!(m>=0)){toast("Enter a number of minutes");return}
var dd=(Math.floor(m/10)-Math.floor(S.mins/10))*6;S.mins=m;S.bal=Math.max(0,S.bal+dd);S.earned=Math.max(0,S.earned+dd);save();render();closeDlg();toast("Minutes set to "+m+(dd?" ("+(dd>0?"+":"")+dd+" tygers)":""))}
else if(a==="close")closeDlg();
else if(a==="copy"){var t=ticketText();var ok=function(){toast("Copied!")};
var fb=function(){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){toast("Couldn't copy, try a screenshot")}x.remove()};
